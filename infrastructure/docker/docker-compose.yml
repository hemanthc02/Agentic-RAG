# Docker stack for the multi-agent-rag project.
#
# HONEST STATUS (see ../../MONOREPO.md "What runs today"):
#   * What's built today is the `app/` prototype: a FastAPI backend on SQLite +
#     an in-process cache, and a Vite/React frontend. It does NOT need Postgres
#     or Redis, and the recommended way to run it locally is `run.bat` (Windows)
#     or the two-process flow in `app/RUNNING.md`.
#   * The containerised `apps/api` (Next-served) + `apps/web` production services
#     described in MONOREPO.md are NOT yet implemented — there are no
#     api.Dockerfile / web.Dockerfile and no apps/api / apps/web source. Those
#     `build:` services were removed from this file so `docker compose up` does
#     not fail on missing build contexts. They will return when those services
#     exist; see the commented stub at the bottom.
#
# The one service that is genuinely useful via Compose today is Ollama, for the
# fully-local LLM mode. Bring it up, then `ollama pull phi3:mini`.

services:
  # Local LLM backend for air-gapped / on-device mode (LLM_MODE=local).
  # After `docker compose up -d ollama`, run: docker exec -it <id> ollama pull phi3:mini
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  ollama: {}

